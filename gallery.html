<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #008080;
      font-family: Tahoma, "MS Sans Serif", sans-serif;
      font-size: 11px;
      color: #000;
    }
    .desktop {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-content: flex-start;
      padding: 18px 108px 48px 18px;
    }
    .watermark {
      position: fixed;
      right: 16px;
      bottom: 42px;
      z-index: 0;
      font-family: Tahoma, "MS Sans Serif", sans-serif;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.34);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.28);
      text-decoration: none;
    }
    .win {
      position: relative;
      z-index: 1;
      background: #c0c0c0;
      padding: 2px;
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
      box-shadow: 1px 1px 0 #000;
    }
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #000080;
      color: #fff;
      font-weight: bold;
      padding: 2px 3px 2px 4px;
      margin-bottom: 2px;
    }
    .titlebar span {
      flex: 1;
      min-width: 0;
      padding-right: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .close {
      flex: none;
      width: 15px;
      height: 14px;
      line-height: 11px;
      text-align: center;
      color: #000;
      background: #c0c0c0;
      text-decoration: none;
      font-weight: bold;
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
    }
    .client {
      position: relative;
      overflow: hidden;
      background: #808080;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
    }
    .client iframe {
      border: 0;
      display: block;
      transform-origin: 0 0;
      pointer-events: none;
    }
    .open {
      position: absolute;
      inset: 0;
    }
    .statusbar {
      margin-top: 2px;
      padding: 2px 4px;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
    }
    .process .client { width: 308px; height: 308px; }
    .process iframe { width: 400px; height: 400px; transform: scale(0.75); }
    .planets .client { width: 348px; height: 272px; }
    .planets iframe { width: 1056px; height: 816px; transform: scale(0.322); }
    .square .client { width: 300px; height: 300px; }
    .square iframe { width: 600px; height: 600px; transform: scale(0.5); }
    .portrait .client { width: 228px; height: 294px; }
    .portrait iframe { width: 816px; height: 1056px; transform: scale(0.27); }
    .portrait.mona iframe {
      width: 400px;
      height: 600px;
      margin-top: -23px;
      transform: scale(0.56);
    }
    .desk-icons {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .desk-icons a {
      width: 76px;
      color: #fff;
      text-align: center;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000;
    }
    .desk-icons img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .desk-icons span {
      display: block;
      margin-top: 4px;
    }
    .taskbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 4px;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      z-index: 20;
    }
    .task {
      font-weight: bold;
      padding: 2px 10px;
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
    }
    .task a { color: #000; text-decoration: none; }
  </style>
</head>
